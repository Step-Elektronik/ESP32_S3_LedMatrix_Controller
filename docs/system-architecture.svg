<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">ESP32-S3 RGB LED Matrix Controller sistem mimarisi</title>
  <desc id="description">Web portalı, kalıcı ayarlar, sensörler, Modbus, içerik motoru, DMA panel sürücüsü, alarm/geri sayım ve panel uyku servisleri arasındaki veri akışı.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 25px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #64748b; }
      .group-label { font: 700 13px Arial, sans-serif; letter-spacing: 0.08em; fill: #475569; }
      .box { stroke-width: 2; rx: 12; filter: url(#shadow); }
      .source { fill: #eff6ff; stroke: #3b82f6; }
      .service { fill: #f0fdf4; stroke: #22c55e; }
      .core { fill: #fff7ed; stroke: #f97316; }
      .output { fill: #faf5ff; stroke: #a855f7; }
      .storage { fill: #f8fafc; stroke: #64748b; }
      .label { font: 600 15px Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 13px Arial, sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
      .line { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#ffffff"/>
  <text class="title" x="42" y="46">ESP32-S3 RGB LED Matrix Controller</text>
  <text class="subtitle" x="42" y="70">Servisler ve temel veri akışı</text>

  <text class="group-label" x="42" y="112">GİRDİLER</text>
  <text class="group-label" x="278" y="112">UYGULAMA SERVİSLERİ</text>
  <text class="group-label" x="540" y="112">İÇERİK VE KONTROL</text>
  <text class="group-label" x="810" y="112">DONANIM ÇIKIŞLARI</text>

  <!-- Connections are drawn first so they remain behind the nodes. -->
  <path class="line" d="M222 151 H278"/>
  <path class="line" d="M458 151 H540"/>
  <path class="line-dashed" d="M630 183 V217"/>
  <path class="line" d="M458 245 H540 V257"/>

  <path class="line" d="M222 315 H278"/>
  <path class="line" d="M222 385 H278"/>
  <path class="line" d="M222 455 H278"/>
  <path class="line" d="M222 525 H278"/>

  <path class="line" d="M458 315 H540 V285"/>
  <path class="line" d="M458 385 H540 V315"/>
  <path class="line" d="M458 470 H540 V345"/>
  <path class="line-dashed" d="M630 183 V257"/>

  <path class="line" d="M720 300 H810"/>
  <path class="line" d="M990 300 H1030"/>

  <path class="line" d="M368 347 V590 H540"/>
  <path class="line-dashed" d="M630 183 V590"/>
  <path class="line" d="M720 590 H810"/>

  <path class="line" d="M368 347 V662 H540"/>
  <path class="line-dashed" d="M630 183 V662"/>
  <path class="line" d="M720 662 H950 V347 H1030"/>

  <!-- Inputs -->
  <rect class="box source" x="42" y="123" width="180" height="56"/>
  <text class="label" x="132" y="151">Web tarayıcısı</text>

  <rect class="box source" x="42" y="287" width="180" height="56"/>
  <text class="label" x="132" y="315">DS3231 RTC</text>

  <rect class="box source" x="42" y="357" width="180" height="56"/>
  <text class="label" x="132" y="377">Sıcaklık/nem</text>
  <text class="small" x="132" y="397">TMP112 / SHT40 / HDC2022</text>

  <rect class="box source" x="42" y="427" width="180" height="56"/>
  <text class="label" x="132" y="449">RS485</text>
  <text class="small" x="132" y="469">Modbus RTU, donanım DIR</text>

  <rect class="box source" x="42" y="497" width="180" height="56"/>
  <text class="label" x="132" y="519">GPIO12</text>
  <text class="small" x="132" y="539">Dijital giriş</text>

  <!-- Services -->
  <rect class="box service" x="278" y="123" width="180" height="56"/>
  <text class="label" x="368" y="143">HTTP portalı</text>
  <text class="small" x="368" y="163">İsteğe bağlı STA girişi</text>

  <rect class="box service" x="278" y="217" width="180" height="56"/>
  <text class="label" x="368" y="245">OTA güncelleme</text>

  <rect class="box service" x="278" y="287" width="180" height="56"/>
  <text class="label" x="368" y="307">Saat servisi</text>
  <text class="small" x="368" y="327">RTC + NTP eşitleme</text>

  <rect class="box service" x="278" y="357" width="180" height="56"/>
  <text class="label" x="368" y="385">Sıcaklık/nem servisi</text>

  <rect class="box service" x="278" y="442" width="180" height="56"/>
  <text class="label" x="368" y="470">ValueBox servisi</text>

  <!-- Core -->
  <rect class="box storage" x="540" y="123" width="180" height="60"/>
  <text class="label" x="630" y="147">NVS</text>
  <text class="small" x="630" y="169">Preferences</text>

  <rect class="box core" x="540" y="257" width="180" height="86"/>
  <text class="label" x="630" y="292">Panel içerik</text>
  <text class="label" x="630" y="313">motoru</text>

  <rect class="box core" x="540" y="562" width="180" height="56"/>
  <text class="label" x="630" y="584">Alarm servisi</text>
  <text class="small" x="630" y="605">Programlı + geri sayım</text>

  <rect class="box core" x="540" y="634" width="180" height="56"/>
  <text class="label" x="630" y="662">Panel uyku servisi</text>

  <!-- Outputs -->
  <rect class="box output" x="810" y="272" width="180" height="56"/>
  <text class="label" x="900" y="294">LCD_CAM</text>
  <text class="small" x="900" y="315">GDMA aktarımı</text>

  <rect class="box output" x="1030" y="272" width="140" height="76"/>
  <text class="label" x="1100" y="300">HUB75 RGB</text>
  <text class="label" x="1100" y="321">paneller</text>

  <rect class="box output" x="810" y="562" width="180" height="56"/>
  <text class="label" x="900" y="584">GPIO42</text>
  <text class="small" x="900" y="605">Röle çıkışı</text>
</svg>
